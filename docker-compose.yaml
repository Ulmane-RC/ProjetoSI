version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-db
    environment:
      POSTGRES_DB: Projeto_SI
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DedsecSecury@0101
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: estoque-app
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/Projeto_SI
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: DedsecSecury@0101